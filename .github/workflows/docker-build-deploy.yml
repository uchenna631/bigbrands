name: CI/CD Pipeline for Django project with Snyk

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  package-django:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.7, 3.8, 3.9]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      run: |
        python manage.py test

  test-with-snyk:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Snyk CLI to check for security issues
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb
        env:
          # This is where you will need to introduce the Snyk API token created with your Snyk account
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Snyk Code test
        run: snyk code test --sarif > snyk-code.sarif # || true

  build-and-push:
    # 🏃 Runs the job on a standard Ubuntu runner
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository code
        # Uses the official action to clone your repo onto the runner
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Sets up the Buildx environment for advanced features like caching
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Authenticates with Docker Hub using your secrets
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        # Performs both the build and the push in a single step
        uses: docker/build-push-action@v5
        with:
          # Context for the build ('.' means the current directory/repo root)
          context: .
          # Set to true to push the image to the registry
          push: true
          # Define the tags for your image
          tags: |
            # Replace 'my-app' with your actual repository name on Docker Hub
            ${{ secrets.DOCKERHUB_USERNAME }}/big-brands:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/big-brands:${{ github.sha }}
          # Use cache to speed up subsequent builds (optional but recommended)
          cache-from: type=gha
          cache-to: type=gha,mode=max
